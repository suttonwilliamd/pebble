name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go: ['1.21.x', stable]
        # Go 1.21's Mach-O linker predates macOS 26's LC_UUID requirement.
        exclude:
          - os: macos-latest
            go: '1.21.x'
        include:
          - os: macos-15
            go: '1.21.x'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: Verify modules
        run: go mod verify
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -count=1
      - name: Race detection
        if: matrix.os == 'ubuntu-latest' && matrix.go == 'stable'
        run: go test -race ./...
      - name: Fuzz streaming roundtrip
        if: matrix.os == 'ubuntu-latest' && matrix.go == 'stable'
        run: go test ./internal/rock -run '^$' -fuzz FuzzStreamRoundTrip -fuzztime 20s

  docker:
    runs-on: ubuntu-latest
    env:
      PEBBLE_AUTHOR: CI Dogfood
      PEBBLE_EMAIL: ci@example.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Create ephemeral test secrets
        run: |
          umask 077
          openssl rand -hex 32 > "$RUNNER_TEMP/pebble-client-token"
          server_token="$RUNNER_TEMP/pebble-server-token"
          echo "PEBBLE_TOKEN_FILE=$server_token" >> "$GITHUB_ENV"
          cp "$RUNNER_TEMP/pebble-client-token" "$server_token"
          sudo chown 65532:65532 "$server_token"
          sudo chmod 0400 "$server_token"
      - name: Validate and start isolated container
        run: |
          docker compose -f deploy/docker/compose.yaml config --quiet
          docker compose -f deploy/docker/compose.yaml up -d --build
          curl --fail --retry 20 --retry-connrefused --retry-delay 1 http://127.0.0.1:7931/healthz
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:7931/v1/refs)" = 401
      - name: Two-client remote roundtrip and stale-push rejection
        run: |
          go build -o "$RUNNER_TEMP/pebble" ./cmd/pebble
          pebble() { PEBBLE_TOKEN_FILE="$RUNNER_TEMP/pebble-client-token" "$RUNNER_TEMP/pebble" "$@"; }
          a=$(mktemp -d); b=$(mktemp -d)
          cd "$a"
          pebble init
          printf 'first\n' > note.txt
          pebble commit 'initial history'
          printf 'second\n' > note.txt
          pebble commit 'second history'
          pebble push http://127.0.0.1:7931
          cd "$b"
          pebble init
          pebble fetch http://127.0.0.1:7931
          pebble checkout incoming/main
          test "$(cat note.txt)" = second
          test "$(pebble log | grep -c '^commit ')" = 2
          pebble branch work
          pebble checkout work
          printf 'client B\n' > note.txt
          pebble commit 'B edit'
          pebble push http://127.0.0.1:7931 main
          pebble fsck
          cd "$a"
          if pebble push http://127.0.0.1:7931; then echo 'ERROR: stale push accepted'; exit 1; fi
      - name: Verify persistence after restart
        run: |
          docker compose -f deploy/docker/compose.yaml restart
          curl --fail --retry 20 --retry-connrefused --retry-delay 1 http://127.0.0.1:7931/healthz
          c=$(mktemp -d); cd "$c"
          export PEBBLE_TOKEN_FILE="$RUNNER_TEMP/pebble-client-token"
          "$RUNNER_TEMP/pebble" init
          "$RUNNER_TEMP/pebble" fetch http://127.0.0.1:7931
          "$RUNNER_TEMP/pebble" checkout incoming/main
          test "$(cat note.txt)" = 'client B'
          "$RUNNER_TEMP/pebble" fsck
      - name: Stop ephemeral test stack
        if: always()
        run: docker compose -f deploy/docker/compose.yaml down -v
