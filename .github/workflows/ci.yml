name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21.x'
      - name: Verify module
        run: go mod tidy && git diff --exit-code
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./...
      - name: Vet snapshot and CLI packages
        run: go vet ./internal/snapshot ./cmd/pebble
      - name: Race-check snapshot and CLI packages
        env:
          CGO_ENABLED: '1'
        run: go test -race ./internal/snapshot ./cmd/pebble
