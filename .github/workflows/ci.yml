name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go: ['1.21.x', stable]
        # Go 1.21's Mach-O linker predates macOS 26's LC_UUID requirement.
        exclude:
          - os: macos-latest
            go: '1.21.x'
        include:
          - os: macos-15
            go: '1.21.x'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: Verify modules
        run: go mod verify
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Actual PB09 writer and recovery compatibility
        shell: bash
        run: |
          base=61586df728b858f04d39775855a78f230bfeb7a9
          old="$(mktemp -d "${RUNNER_TEMP//\\//}/pebble-pb10-old-XXXXXX")"
          git cat-file -e "$base^{commit}" || git fetch --no-tags origin "$base"
          # GNU tar treats a Windows drive colon in an archive name as remote.
          git archive --format=tar "$base" go.mod go.sum cmd internal | tar -xf - -C "$old"
          printf '%s\n' "$base" > "$old/BASELINE"
          PEBBLE_TEST_OLD_SOURCE="$old" PEBBLE_REQUIRE_OLD_CONSUMER=1 \
            go test ./internal/repository -run '^TestFilesystemOldConsumers$' -count=1 -timeout=5m -v
      - name: Native literal links and metadata history
        if: runner.os != 'Windows'
        run: |
          PEBBLE_REQUIRE_LINKS=1 go test ./internal/repository ./cmd/pebble -run '^TestFilesystem(LiteralSymlinkHistory|DirectoryHintHistory|ExecutableMetadataHistory|POSIXLiteralBytes|POSIXAmbiguousCapture|LinkDirectoryTransitions|LinkRestoreRecoveryPreservesLaterEdit|MutationRaces|ReadParentRace|CLI)$' -count=1 -timeout=5m -v
      - name: Native Windows target parsing and capability refusal
        if: runner.os == 'Windows'
        shell: bash
        run: |
          PEBBLE_REQUIRE_JUNCTION=1 go test ./internal/repository ./cmd/pebble -run '^TestFilesystem(WindowsTargetDecoding|WindowsTargetNativeRoundtrip|RejectsJunctionRecovery|UnsupportedTargetInterpretation|LiteralSymlinkHistory|CLI)$' -count=1 -timeout=5m -v
      - name: Filesystem normalization alias regression
        if: startsWith(matrix.os, 'macos')
        run: go test ./internal/repository -run 'TestCheckout.*Normalization' -count=1 -v
      - name: Unprivileged POSIX read-only worktree regression
        if: runner.os != 'Windows'
        run: |
          id
          PEBBLE_REQUIRE_UNPRIVILEGED=1 go test ./internal/repository -run '^(TestReadOnlyOriginalCheckoutAndRestore|TestFilesystemPermissionFailures|TestFilesystemNativeRenameAmbiguity)$' -count=1 -timeout=5m -v
      - name: Native automatic recovery, no-clobber receipts and actual5c4 writers
        shell: bash
        run: |
          base=5c4c4532f1af8d2ea013d32fb190019961969583
          old="$(mktemp -d "${RUNNER_TEMP//\\//}/pebble-pb10-recovery-old-XXXXXX")"
          git cat-file -e "$base^{commit}" || git fetch --no-tags origin "$base"
          git archive --format=tar "$base" go.mod go.sum cmd internal | tar -xf - -C "$old"
          printf '%s\n' "$base" > "$old/BASELINE"
          if [ "$RUNNER_OS" != Windows ]; then
            id
            export PEBBLE_REQUIRE_UNPRIVILEGED=1 PEBBLE_REQUIRE_LINKS=1
          fi
          PEBBLE_TEST_RECOVERY_OLD_SOURCE="$old" PEBBLE_REQUIRE_RECOVERY_OLD_CONSUMER=1 \
            go test ./internal/repository ./cmd/pebble -run '^(TestAutomaticRecovery.*|TestFilesystemAutomaticRecovery.*|TestFilesystemNativeRenameAmbiguity)$' -count=1 -timeout=12m -v
      - name: Test
        run: go test ./... -count=1 -timeout=12m
      - name: Race detection
        if: matrix.os == 'ubuntu-latest' && matrix.go == 'stable'
        run: go test -race ./...
      - name: Fuzz streaming roundtrip
        if: matrix.os == 'ubuntu-latest' && matrix.go == 'stable'
        run: go test ./internal/rock -run '^$' -fuzz FuzzStreamRoundTrip -fuzztime 20s

  docker:
    runs-on: ubuntu-latest
    env:
      PEBBLE_AUTHOR: CI Dogfood
      PEBBLE_EMAIL: ci@example.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Create ephemeral test secrets
        run: |
          umask 077
          openssl rand -hex 32 > "$RUNNER_TEMP/pebble-client-token"
          server_token="$RUNNER_TEMP/pebble-server-token"
          echo "PEBBLE_TOKEN_FILE=$server_token" >> "$GITHUB_ENV"
          cp "$RUNNER_TEMP/pebble-client-token" "$server_token"
          sudo chown 65532:65532 "$server_token"
          sudo chmod 0400 "$server_token"
      - name: Validate and start isolated container
        run: |
          docker compose -f deploy/docker/compose.yaml config --quiet
          docker compose -f deploy/docker/compose.yaml up -d --build
          curl --fail --retry 20 --retry-all-errors --retry-delay 1 http://127.0.0.1:7931/healthz
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:7931/v1/refs)" = 401
      - name: Legacy two-client roundtrip and stale-push rejection
        env:
          PEBBLE_TEST_REMOTE_URL: http://127.0.0.1:7931
        run: |
          PEBBLE_TOKEN_FILE="$RUNNER_TEMP/pebble-client-token" \
            go test ./cmd/pebble -run '^TestLegacyRemoteCLI$' -count=1
      - name: Verify persistence after restart
        run: |
          docker compose -f deploy/docker/compose.yaml restart
          curl --fail --retry 20 --retry-all-errors --retry-delay 1 http://127.0.0.1:7931/healthz
          PEBBLE_TEST_REMOTE_URL=http://127.0.0.1:7931 \
            PEBBLE_TOKEN_FILE="$RUNNER_TEMP/pebble-client-token" \
            go test ./cmd/pebble -run '^TestLegacyRemotePersistence$' -count=1
      - name: Stop ephemeral test stack
        if: always()
        run: docker compose -f deploy/docker/compose.yaml down -v
